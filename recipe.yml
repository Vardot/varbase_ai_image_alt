name: Varbase AI Image Alt
description: Grants Varbase user roles the permission to generate AI image alt text, provided by the Drupal CMS AI ecosystem.
type: Varbase AI
install:
  - ai
  - ai_image_alt_text
  - ai_image_bulk_alt_text
config:
  import:
    ai_image_alt_text: '*'
  actions:
    user.role.site_admin:
      grantPermissions:
        - 'generate ai alt tags'
    user.role.seo_admin:
      grantPermissions:
        - 'generate ai alt tags'
    user.role.content_admin:
      grantPermissions:
        - 'generate ai alt tags'
    user.role.content_editor:
      grantPermissions:
        - 'generate ai alt tags'
