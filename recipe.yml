name: Varbase AI Image Alt
description: Provides a recipe to automatically generate and fill the alt text of an image field using AI.
type: Varbase AI
install:
  - ai
  - ai_image_alt_text
  - ai_image_bulk_alt_text
config:
  import:
    ai_image_alt_text: '*'
  actions:
    user.role.site_admin:
      grantPermissions:
        - 'generate ai alt tags'
    user.role.seo_admin:
      grantPermissions:
        - 'generate ai alt tags'
    user.role.content_admin:
      grantPermissions:
        - 'generate ai alt tags'
    user.role.editor:
      grantPermissions:
        - 'generate ai alt tags'
